<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אין חיבור</title>
<script src="shop.js"></script>
<style>
  @font-face { font-family: Rubik; src: url(fonts/rubik-hebrew.woff2) format("woff2"); font-weight: 300 900; unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: Rubik; src: url(fonts/rubik-latin.woff2) format("woff2"); font-weight: 300 900; }
  :root { --ink:#111; --mut:#6b655a; --pole-red:#a8323a; --pole-blue:#2f4a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; font-family: Rubik, system-ui, sans-serif; color: var(--ink); background: #fff; text-align: center;
    padding: calc(30px + env(safe-area-inset-top)) 28px calc(30px + env(safe-area-inset-bottom)); }
  section { width: 100%; max-width: 420px; margin: 0 auto; padding: 28px 22px 22px; border: 1px solid #dedad2; border-radius: 18px; }
  body::before, body::after { content: ""; position: fixed; top: 0; bottom: 0; width: 12px;
    background: repeating-linear-gradient(-45deg, var(--pole-red) 0 7px, #fff 7px 10px, var(--pole-blue) 10px 17px, #fff 17px 20px); }
  body::before { left: 0; } body::after { right: 0; }
  svg { width: 64px; height: 64px; fill: none; stroke: var(--mut); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 14px 0 6px; font-size: 22px; }
  p { margin: 0 0 26px; color: var(--mut); line-height: 1.6; }
  button { width: 100%; min-height: 48px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: inherit; font-size: 15px; font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) { button:active { transform: scale(.98); } }
</style>
</head>
<body>
  <section>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 4.2-2.6M9.8 5.2A15 15 0 0 1 22 8.8M5 12.5a10 10 0 0 1 5.1-2.6M16.8 10.9a10 10 0 0 1 2.2 1.6M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/><path d="M3 3l18 18"/></svg>
  <h1>אין חיבור כרגע</h1>
  <p>בדקו את ה־Wi‑Fi או את הגלישה בסלולר. ברגע שהחיבור יחזור, המספרה תיפתח מעצמה.</p>
  </section>
  <script>
    // The connection is back: the shop opens without a tap.
    window.addEventListener("online", () => location.replace(window.SHOP_URL));
  </script>
</body>
</html>
